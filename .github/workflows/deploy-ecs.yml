name: Build and deploy ECS docs
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ecs-docs-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run docs:build
        env:
          DOCS_LOCAL_SEARCH: '1'
          DOCS_SITE_ORIGIN: https://docs.vmct.top
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecs-docs
          path: docs/.vitepress/dist
          retention-days: 7
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ecs-docs
          path: ${{ runner.temp }}/ecs-docs
      - name: Prepare deployment client
        run: cp .github/scripts/deploy.py "$RUNNER_TEMP/deploy.py"
      - name: Publish built artifact branch
        id: artifact
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          manifest = {"sha": os.environ["SOURCE_SHA"], "repository": os.environ["GITHUB_REPOSITORY"]}
          pathlib.Path(os.environ["RUNNER_TEMP"], "ecs-docs", "deployment.json").write_text(json.dumps(manifest))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --orphan ecs-artifacts
          git --work-tree="$RUNNER_TEMP/ecs-docs" add --all
          git commit -m "Build docs from $SOURCE_SHA"
          git push --force origin HEAD:refs/heads/ecs-artifacts
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Trigger server and wait for final deployment result
        env:
          DEPLOY_TOKEN: ${{ secrets.DOCS_DEPLOY_TOKEN }}
          DEPLOY_URL: https://docs.vmct.top/internal/deploy
          SOURCE_SHA: ${{ github.sha }}
          ARTIFACT_SHA: ${{ steps.artifact.outputs.sha }}
        run: python3 "$RUNNER_TEMP/deploy.py"
