server {
    listen 80;
    listen [::]:80;
    server_name docs.vmct.top;
    return 301 https://docs.vmct.top$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name docs.vmct.top;
    ssl_certificate /etc/letsencrypt/live/vmct.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vmct.top/privkey.pem;
    root /home/vmct/vmpm/dist/docs.vmct.top;
    index index.html;

    location = /internal/deploy {
        client_max_body_size 4k;
        proxy_pass http://172.17.0.1:8790/deploy;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 15s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control no-store always;
    }
    location ^~ /internal/deploy/ {
        proxy_pass http://172.17.0.1:8790/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 15s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control no-store always;
    }
    location = /.vmct-release.json {
        add_header Cache-Control no-store always;
        try_files $uri =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control no-cache;
        try_files $uri $uri.html $uri/ =404;
        error_page 404 /404.html;
    }
}
